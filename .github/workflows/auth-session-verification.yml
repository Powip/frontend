name: Auth session verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/api/auth/**'
      - 'src/lib/server/authProxy.ts'
      - 'src/contexts/AuthContext.tsx'
      - 'src/contexts/__tests__/AuthContext*.test.tsx'
      - 'src/components/forms/LoginForm.tsx'
      - 'src/components/forms/__tests__/LoginForm*.test.tsx'
      - 'src/services/onboardingService.ts'
      - 'src/services/__tests__/onboardingService.auth.test.ts'
      - 'scripts/verify-safari-auth.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-session-verification.yml'
  push:
    branches: [main]
    paths:
      - 'src/app/api/auth/**'
      - 'src/lib/server/authProxy.ts'
      - 'src/contexts/AuthContext.tsx'
      - 'src/contexts/__tests__/AuthContext*.test.tsx'
      - 'src/components/forms/LoginForm.tsx'
      - 'src/components/forms/__tests__/LoginForm*.test.tsx'
      - 'src/services/onboardingService.ts'
      - 'src/services/__tests__/onboardingService.auth.test.ts'
      - 'scripts/verify-safari-auth.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/auth-session-verification.yml'

permissions:
  contents: read

concurrency:
  group: auth-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript
        run: npm run typecheck
      - name: Verify auth ESLint rules used by the production build
        env:
          NODE_ENV: production
        run: >-
          npx eslint
          src/app/api/auth
          src/lib/server/authProxy.ts
          src/contexts/AuthContext.tsx
          'src/contexts/__tests__/AuthContext*.test.tsx'
          src/components/forms/LoginForm.tsx
          'src/components/forms/__tests__/LoginForm*.test.tsx'
          src/services/onboardingService.ts
          src/services/__tests__/onboardingService.auth.test.ts
          scripts/verify-safari-auth.mjs
      - name: Verify auth, onboarding and session regressions
        run: >-
          npm test -- --runInBand --silent
          src/app/api/auth
          src/contexts/__tests__
          src/components/forms/__tests__/LoginForm
          src/services/__tests__/onboardingService.auth.test.ts
          src/hooks/__tests__/useOnboardingFlow
          src/app/onboarding/__tests__
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Verify Safari session and paid callback
        run: node scripts/verify-safari-auth.mjs
