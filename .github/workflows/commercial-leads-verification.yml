name: Commercial leads regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'jest.commercial-leads.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/commercial-leads-verification.yml'

permissions:
  contents: read

concurrency:
  group: commercial-leads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without production secrets
        run: npm ci --no-audit --no-fund
      - name: Leads, conversion, advances, reports and compatibility regressions
        run: node node_modules/jest/bin/jest.js --config jest.commercial-leads.config.cjs --runInBand --silent
